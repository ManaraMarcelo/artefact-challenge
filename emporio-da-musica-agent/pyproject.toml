[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.5",
    "google-genai>=1.30",
    "pandas>=2.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
emporio-chat = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
